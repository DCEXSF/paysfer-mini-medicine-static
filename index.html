<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Medicine</title>
    <meta
      name="description"
      content="Mini Medicine product listing for supplements and wellness essentials."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar" aria-label="Main navigation">
      <div class="topbar-inner">
        <a class="brand" href="https://www.paysfer.com/" aria-label="Paysfer home" target="_blank" rel="noopener noreferrer">
          <img src="https://storage.googleapis.com/content.paysfer.com/banner/white-logo.png" alt="Paysfer" />
        </a>

        <div class="search-wrap">
          <label class="search-field" for="searchInput">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
              <path d="M16 16L21 21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="Search by title, ISBN"
              aria-label="Search products"
            />
          </label>
        </div>

        <div class="header-actions">
          <a class="login-link" href="https://www.paysfer.com/signin" aria-label="Login" target="_blank" rel="noopener noreferrer">
            <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
              <path d="M4 19c1.7-3 4.5-4.5 8-4.5S18.3 16 20 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
            <span>Login</span>
          </a>

          <a class="cart-link" href="https://www.paysfer.com/cart" aria-label="Cart" target="_blank" rel="noopener noreferrer">
            <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="9" cy="18" r="1.6" fill="currentColor"></circle>
              <circle cx="17" cy="18" r="1.6" fill="currentColor"></circle>
              <path d="M3.5 4h2.1l2.6 9.5h9.5l2.3-7H7.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span>Cart</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero-banner" aria-label="Mini Medicine banner"></section>

      <section class="products-section">
        <div class="container">
          <div id="productsGrid" class="products-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script>
      const API_URL = 'https://paysfer-backend-337705274204.us-central1.run.app/seller/v1/seller-pagination-products';
      const sellerId = '0592de2a-815c-4929';

      const productGrid = document.getElementById('productsGrid');
      const searchInput = document.getElementById('searchInput');
      let allProducts = [];

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function slugifyTitle(title = '') {
        return String(title)
          .replace(/[^a-zA-Z0-9]+/g, '_')
          .replace(/^_+|_+$/g, '')
          .replace(/_+/g, '_');
      }

      function buildProductUrl(product) {
        const productId = product?._id || product?.id || '';
        const title = product?.title || 'Product';
        const slug = slugifyTitle(title);

        if (!productId) {
          return '#';
        }

        return `https://www.paysfer.com/product-page/${productId}/${slug}?src=from-search`;
      }

      function renderProducts(products) {
        if (!Array.isArray(products) || !products.length) {
          productGrid.innerHTML = '<p class="empty-state">No products found.</p>';
          return;
        }

        productGrid.innerHTML = products
          .map((product) => {
            const title = product.title || 'Supplement product';
            const image = product.productgroupimageurl1 || (Array.isArray(product.productgroupimageurl2) ? product.productgroupimageurl2[0] : '');
            const originalPrice = Number(product.price && product.price[0] ? product.price[0] : 0);
            const salePrice = Number(product.saleprice && product.saleprice[0] ? product.saleprice[0] : originalPrice);
            const discountPercent = originalPrice > salePrice ? Math.round(((originalPrice - salePrice) / originalPrice) * 100) : 0;
            const isMapProduct = Boolean(product.map);
            const listPrice = Number(product.bookMeta?.stock?.listPrice || originalPrice || 0);
            const displayPrice = isMapProduct ? listPrice : salePrice;
            const productUrl = buildProductUrl(product);

            return `
              <article class="product-card" data-product-url="${escapeHtml(productUrl)}">
                <div class="product-image-wrap">
                  <img src="${escapeHtml(image)}" alt="${escapeHtml(title)}" loading="lazy" />
                  ${discountPercent && !isMapProduct ? `<span class="product-badge">${discountPercent}% off</span>` : ''}
                </div>
                <h3>${escapeHtml(title)}</h3>
                <div class="price-row">
                  ${isMapProduct
                    ? `<span class="price">$${displayPrice.toFixed(2)}</span>`
                    : `<span class="price">$${salePrice.toFixed(2)}</span>
                      ${originalPrice > salePrice ? `<span class="old-price">$${originalPrice.toFixed(2)}</span>` : ''}`}
                </div>
                ${isMapProduct ? `<div class="checkout-discount">Get ${discountPercent}% discount at checkout</div>` : ''}
                <div class="stock-row"><span class="stock-dot"></span>In Stock</div>
                <button type="button" class="add-cart" data-product-url="${escapeHtml(productUrl)}">Buy Now</button>
              </article>
            `;
          })
          .join('');

        productGrid.querySelectorAll('.product-card').forEach((card) => {
          card.addEventListener('click', (event) => {
            const target = event.target;
            if (target.closest('.add-cart')) {
              event.stopPropagation();
              return;
            }

            const productUrl = card.dataset.productUrl;
            if (productUrl && productUrl !== '#') {
              window.open(productUrl, '_blank', 'noopener,noreferrer');
            }
          });
        });

        productGrid.querySelectorAll('.add-cart').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const productUrl = button.dataset.productUrl;
            if (productUrl && productUrl !== '#') {
              window.open(productUrl, '_blank', 'noopener,noreferrer');
            }
          });
        });
      }

      function filterProducts(searchTerm) {
        const normalizedSearch = searchTerm.trim().toLowerCase();

        if (!normalizedSearch) {
          renderProducts(allProducts);
          return;
        }

        const filteredProducts = allProducts.filter((product) => {
          const title = String(product?.title || '').toLowerCase();
          const isbn = String(product?.isbn || product?.ISBN || '').toLowerCase();
          const author = String(product?.author || '').toLowerCase();

          return title.includes(normalizedSearch) || isbn.includes(normalizedSearch) || author.includes(normalizedSearch);
        });

        renderProducts(filteredProducts);
      }

      if (searchInput) {
        searchInput.addEventListener('input', (event) => {
          filterProducts(event.target.value);
        });
      }

      async function fetchProducts() {
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ sellerId, page: 1 })
          });

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          const products = data?.ResponseBody?.products || [];
          allProducts = products;
          renderProducts(allProducts);
        } catch (error) {
          console.error('Failed to load products:', error);
          productGrid.innerHTML = '<p class="empty-state">Unable to load products right now.</p>';
        }
      }

      fetchProducts();
    </script>
  </body>
</html>
